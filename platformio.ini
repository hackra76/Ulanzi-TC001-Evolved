; PlatformIO Project Configuration File for Ulanzi TC001 Evolved
; Board: ESP32-WROOM-32 (4MB Flash, No PSRAM, 8x32 WS2812B NeoPixel Matrix)

[platformio]
default_envs = ulanzi-tc001

[env:ulanzi-tc001]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags = 
	-DCORE_DEBUG_LEVEL=1
	-O2
lib_deps = 
	adafruit/Adafruit GFX Library @ ^1.11.10
	adafruit/Adafruit NeoMatrix @ ^1.3.3
	adafruit/Adafruit NeoPixel @ ^1.12.3
	adafruit/Adafruit SHT31 Library @ ^2.2.2
	bblanchon/ArduinoJson @ ^7.1.0
